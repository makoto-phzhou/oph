<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>OaiQ Pixel Helper</title>
    <style>
      body {
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        width: 320px;
        padding: 12px;
        color: #1a1a1a;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 10px;
      }
      h2 {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #666;
        margin: 14px 0 6px;
      }
      .status-card {
        border: 1px solid #e2e2e2;
        border-radius: 8px;
        padding: 8px 10px;
      }
      .row {
        display: flex;
        justify-content: space-between;
        padding: 4px 0;
      }
      .label {
        color: #555;
      }
      .value.ok {
        color: #147a3d;
        font-weight: 600;
      }
      .value.bad {
        color: #b3261e;
        font-weight: 600;
      }
      .muted {
        color: #888;
      }
      .pixel-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .pixel-list li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 6px 0;
        border-bottom: 1px solid #f0f0f0;
      }
      .pixel-id {
        font-family: ui-monospace, Menlo, monospace;
        font-size: 12px;
      }
      .chip {
        display: inline-block;
        background: #f0f0f0;
        border-radius: 10px;
        padding: 1px 8px;
        font-size: 10px;
        margin-left: 4px;
        color: #444;
      }
    </style>
  </head>
  <body>
    <h1>OaiQ Pixel Helper</h1>
    <div id="root">Loading…</div>
    <script src="popup.js"></script>
  </body>
</html>
